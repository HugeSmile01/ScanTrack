<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScanTrack – QR Scanner</title>
  <meta name="theme-color" content="#10AC84" />
  <link rel="manifest" href="manifest.json" />

  <!-- MDL + Icons -->
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.cyan-light_blue.min.css" />
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <!-- QR Reader & Alert -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
    <!-- Firebase App (core SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  
  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="Script/login.js" type="text/javascript" charset="utf-8"></script>
  
  <style>
    :root {
      --bg-main: #202124;
      --bg-header: #303134;
      --bg-drawer: #171717;
      --text-primary: #E8EAED;
      --text-secondary: #B0B0B0;
      --accent: #10AC84;
    }

    body, .mdl-layout__content {
      background-color: var(--bg-main);
      color: var(--text-primary);
    }

    .mdl-layout__header {
      background-color: var(--bg-header);
    }

    .page-content {
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }

    input[type="text"],
    input[type="number"],
    select {
      display: block;
      width: 100%;
      max-width: 100%;
      padding: 12px;
      background-color: #2c2c2e;
      border: none;
      border-radius: 4px;
      color: #E8EAED;
      margin-bottom: 16px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
    }
    .mdl-button--icon .material-icons {
  color: var(--text-primary);
}

  </style>
</head>
<body>
  <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
<header class="mdl-layout__header">
  <div class="mdl-layout__header-row">
    <!-- Replace hamburger with back icon -->
    <button class="mdl-button mdl-js-button mdl-js-ripple-effect mdl-button--icon mdl-layout__drawer-button" onclick="history.back()">
      <i class="material-icons">arrow_back</i>
    </button>

    <span class="mdl-layout-title" style="text-align: center; color: white;">Attendance Portal</span>
    <div class="mdl-layout-spacer"></div>
  </div>
</header>




    <main class="mdl-layout__content">
      <div class="page-content">

        <!-- QR Scanner -->
        <section style="text-align:center; padding: 20px;">
          <h3 class="mdl-typography--display-1">QR Attendance Scanner</h3>
          <div id="my-qr-reader" style="width:100%; max-width:400px; margin:auto;"></div>
          <br/>
          <select id="qrClassName">
            <option disabled selected>Select Class</option>
            <option value="Reading and writing">Reading and writing</option>
            <option value="GENCHEM">GENCHEM</option>
          </select>
          <select id="qrRoom">
            <option value="Main" selected>Main Room</option>
            <option value="1">Room 1</option>
          </select>
          <input type="text" id="teacher-name" placeholder="FIRSTNAME LASTNAME (UPPERCASE)" oninput="this.value = this.value.toUpperCase()" />
          <select id="attendanceStatus">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Excused">Excused</option>
          </select>
        </section>

        <!-- Manual Form -->
        <section>
          <h4>Manual Attendance</h4>
          <input type="number" id="manualStudentId" placeholder="Student ID" />
          <input type="text" id="manualStudentName" placeholder="Student Name" />
          <select id="manualClassName">
            <option disabled selected>Select Class</option>
            <option value="GENCHEM">GENCHEM</option>
            <option value="Media and Information Literacy">Media and Information Literacy</option>
          </select>
          <select id="manualRoom">
            <option value="Main">Main</option>
            <option value="1">Room 1</option>
          </select>
          <select id="manualStatus">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
          </select>
          <button onclick="manualMarkAttendance()" class="mdl-button mdl-js-button mdl-button--raised mdl-button--accent mdl-js-ripple-effect">
            Mark Attendance
          </button>
        </section>

      </div>
    </main>
  </div>

  <!-- Script -->
  <script src="Script/scanner.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
